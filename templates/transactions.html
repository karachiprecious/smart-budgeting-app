<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Transactions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #e8f0ff, #fdfbfb);
        font-family: 'Poppins', sans-serif;
    }
    .navbar {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .table thead {
        background-color: #185a9d;
        color: #fff;
    }
    a.btn-main {
        background: linear-gradient(135deg, #2193b0, #6dd5ed);
        border: none;
        color: white;
        padding: 8px 16px;
        border-radius: 12px;
        text-decoration: none;
        transition: 0.3s;
    }
    a.btn-main:hover { opacity: 0.85; }
    .btn-danger {
        border-radius: 10px;
        padding: 4px 10px;
    }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg py-3 mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-primary" href="#">💰 SmartBudget</a>
        <div>
            <a href="{{ url_for('dashboard') }}" class="btn-main me-2">Dashboard</a>
            <a href="{{ url_for('add_transaction') }}" class="btn btn-success me-2">Add Transaction</a>
            <a href="{{ url_for('import_file') }}" class="btn btn-warning">Import CSV</a>
        </div>
    </div>
</nav>

<!-- Transactions Table -->
<div class="container py-4">
    <h3 class="mb-4">📋 All Transactions</h3>
    <div class="table-responsive shadow rounded-4 bg-white p-3">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Amount (₦)</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for txn in transactions %}
                <tr>
                    <td>{{ txn.date }}</td>
                    <td>{{ txn.category }}</td>
                    <td>{{ txn.description }}</td>
                    <td>{{ "{:,.2f}".format(txn.amount) }}</td>
                    <td class="text-center">
                        <form action="{{ url_for('delete_transaction', tx_id=txn.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this transaction?');">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="5" class="text-center text-muted">No transactions found</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
