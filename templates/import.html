<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Import CSV</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background: linear-gradient(135deg,#e8f0ff,#fdfbfb); font-family: 'Poppins', sans-serif; }
    .navbar { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .card { border-radius: 16px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg py-3 mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-primary" href="#">💰 SmartBudget</a>
        <div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary me-2">Dashboard</a>
            <a href="{{ url_for('list_transactions') }}" class="btn btn-outline-primary">All Transactions</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="card mx-auto" style="max-width:500px;">
        <h4 class="mb-4">📤 Import Transactions CSV</h4>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div>
            {% for category, msg in messages %}
            <div class="alert alert-{{ category }} py-2">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label>Select CSV File</label>
                <input type="file" name="file" accept=".csv" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-warning">Import CSV</button>
        </form>
    </div>
</div>
</body>
</html>
